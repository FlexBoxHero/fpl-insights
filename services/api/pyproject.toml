[project]
name = "fpl-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fpl-shared",
    "fpl-etl",
    "fpl-ml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
